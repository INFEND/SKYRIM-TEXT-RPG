plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
def releaseSigning = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) signingFile.withInputStream { releaseSigning.load(it) }
android {
    namespace 'dev.infend.skyrimtext'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.infend.skyrimtext.engine'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
        ndk { abiFilters 'arm64-v8a' }
    }
    if (signingFile.exists()) {
        signingConfigs {
            release {
                storeFile rootProject.file(releaseSigning.getProperty('storeFile','release.jks'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    packaging { resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] } }
}
dependencies {
    implementation 'io.github.ljcamargo:llamacpp-kotlin:0.4.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
