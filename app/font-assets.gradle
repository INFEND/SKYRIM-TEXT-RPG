// Reproducible offline fonts; never require network access at game runtime.
def choiceManifest = file('font-choices.json')
def choiceAssets = layout.buildDirectory.dir('generated/choiceFontAssets')
def fetchChoiceFonts = tasks.register('fetchChoiceFonts') {
    inputs.file(choiceManifest)
    outputs.dir(choiceAssets)
    doLast {
        def spec = new groovy.json.JsonSlurper().parse(choiceManifest)
        def root = choiceAssets.get().asFile
        spec.families.collectMany { it.files }.each { entry ->
            File target = new File(root, entry.asset)
            def valid = { File f ->
                if (!f.isFile() || f.length() != entry.size) return false
                def digest = java.security.MessageDigest.getInstance('SHA-1')
                digest.update(("blob " + f.length()).getBytes('UTF-8'))
                digest.update((byte)0)
                f.withInputStream { input ->
                    byte[] buffer = new byte[32768]
                    int count
                    while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
                }
                digest.digest().encodeHex().toString() == entry.gitSha
            }
            if (!valid(target)) {
                target.parentFile.mkdirs()
                File temporary = new File(target.parentFile, target.name + '.part')
                String encoded = entry.path.split('/').collect {
                    java.net.URLEncoder.encode(it, 'UTF-8').replace('+', '%20')
                }.join('/')
                Exception last = null
                for (int attempt = 0; attempt < 3; attempt++) {
                    try {
                        def connection = new URL("https://raw.githubusercontent.com/google/fonts/" + spec.revision + "/" + encoded).openConnection()
                        connection.connectTimeout = 20000
                        connection.readTimeout = 30000
                        connection.inputStream.withCloseable { input ->
                            temporary.withOutputStream { output -> output << input }
                        }
                        if (!valid(temporary)) throw new GradleException("Font integrity mismatch: " + entry.path)
                        java.nio.file.Files.move(temporary.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                        last = null
                        break
                    } catch (Exception failure) {
                        last = failure
                        temporary.delete()
                    }
                }
                if (last != null) throw new GradleException("Cannot prepare bundled font: " + entry.path, last)
            }
        }
    }
}
android.sourceSets.main.assets.srcDir(choiceAssets)
tasks.named('preBuild').configure { dependsOn(fetchChoiceFonts) }
