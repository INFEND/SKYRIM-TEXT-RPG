name: Verify canonical Russian Skyrim names
on:
  push:
    branches:
      - 'fix/wiki-*'
      - 'feat/wiki-*'
  pull_request:
    paths:
      - 'app/src/main/java/dev/infend/skyrimtext/RpgContent.java'
      - 'app/src/main/java/dev/infend/skyrimtext/CanonicalCampaign.java'
      - 'app/src/main/java/dev/infend/skyrimtext/MainActivity.java'
      - 'app/src/main/java/dev/infend/skyrimtext/SkyrimMapPoints.java'
      - 'app/src/main/java/dev/infend/skyrimtext/SkyrimMapCatalog.java'
      - 'app/src/main/java/dev/infend/skyrimtext/WorldAtlas.java'
      - 'app/src/main/java/dev/infend/skyrimtext/ItemCatalog.java'
      - 'app/src/main/java/dev/infend/skyrimtext/AiStoryClient.java'
      - 'tests/test_wiki_ru_names.py'
      - 'tests/test_wiki_ru_equipment.py'
      - 'tests/test_wiki_ru_quests.py'
      - 'tools/map_names_ru.txt'
permissions:
  contents: read

jobs:
  python-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate localized names and compatibility
        run: python3 -m unittest discover -s tests -p 'test_wiki_ru_names.py' -v
      - name: Run full Python regression
        run: python3 -m unittest discover -s tests -p 'test_*.py' -q

  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 36
        shell: bash
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile debug APK (no release)
        run: gradle --no-daemon :app:assembleDebug
