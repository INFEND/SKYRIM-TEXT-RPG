name: Verify canonical Russian Skyrim names
on:
  push:
    branches: [main, 'fix/wiki-*', 'feat/wiki-*']
    paths:
      - 'app/src/**'
      - 'tests/test_wiki_ru*'
      - 'tools/**'
      - 'scripts/test_*ota*'
      - 'scripts/test_signed_android_upgrade.sh'
      - 'scripts/check_published_update_dialog.py'
      - '.github/workflows/wiki-ru-names-verify.yml'
  workflow_run:
    workflows: ["Android APK and OTA"]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - 'app/src/**'
      - 'tests/test_wiki_ru*'
      - 'tools/**'
      - 'scripts/test_*ota*'
      - 'scripts/test_signed_android_upgrade.sh'
      - 'scripts/check_published_update_dialog.py'
      - '.github/workflows/wiki-ru-names-verify.yml'
permissions:
  contents: read

jobs:
  localization:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check the live registry and export unresolved identities
        run: python3 tools/audit_localization.py --live --json "$RUNNER_TEMP/registry.json"
      - name: Export up-to-date localization coverage and remaining identities
        env:
          REGISTRY_JSON: ${{ runner.temp }}/registry.json
          CURRENT_STATUS: ${{ runner.temp }}/localization-status.md
          CURRENT_PENDING: ${{ runner.temp }}/localization-pending.tsv
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import audit_localization
          report = json.loads(Path(os.environ['REGISTRY_JSON']).read_text(encoding='utf-8'))
          header = '# Актуальный аудит русификации Skyrim\n\n' + 'Коммит: `' + os.environ['GITHUB_SHA'] + '`\n\n'
          Path(os.environ['CURRENT_STATUS']).write_text(
              header + audit_localization.markdown_table(report['counts']) + '\n',
              encoding='utf-8')
          Path(os.environ['CURRENT_PENDING']).write_text(
              audit_localization.pending_table(report['entities']), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: russian-localization-registry
          path: |
            ${{ runner.temp }}/registry.json
            ${{ runner.temp }}/localization-status.md
            ${{ runner.temp }}/localization-pending.tsv
      - name: Run Python localization and regression checks
        run: python3 -m unittest discover -s tests -p 'test_*.py' -q
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0"'
      - name: Run Android unit tests and assemble the debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

  ota-device:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       contains(github.event.head_commit.message, '[verify-published-ota]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Select the signed release and its predecessor
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          tag="v$version"
          if ! git fetch -q --depth=1 origin "refs/tags/$tag:refs/tags/$tag"; then exit 0; fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_run && "$(git rev-parse "$tag^{commit}")" != "$(git rev-parse HEAD)" ]]; then exit 0; fi
          predecessor=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" | python3 -c '
          import json, sys
          def version(s): return tuple(int(part) for part in s.split("."))
          current = version(sys.argv[1])
          choices = [(version(r["tag_name"][1:]), r["tag_name"]) for r in json.load(sys.stdin)
                     if not r["draft"] and not r["prerelease"] and r["tag_name"].startswith("v") and all(p.isdigit() for p in r["tag_name"][1:].split("."))
                     and any(a["name"] == "SKYRIM-TEXT-RPG.apk" for a in r["assets"])]
          print(max(tag for tag in choices if tag[0] < current)[1])' "$version")
          gh release download "$predecessor" --pattern SKYRIM-TEXT-RPG.apk --dir "$RUNNER_TEMP"
          gh release download "$tag" --pattern SKYRIM-TEXT-RPG.apk --pattern update.json --dir "$RUNNER_TEMP/new-release"
          python3 - "$RUNNER_TEMP/new-release" "$version" <<'PYTHON'
          import hashlib, json, sys
          from pathlib import Path
          directory = Path(sys.argv[1])
          apk = (directory / "SKYRIM-TEXT-RPG.apk").read_bytes()
          manifest = json.loads((directory / "update.json").read_text())
          assert manifest["versionName"] == sys.argv[2] and manifest["sizeBytes"] == len(apk)
          assert manifest["sha256"].lower() == hashlib.sha256(apk).hexdigest()
          PYTHON
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Enable Android hardware acceleration
        if: steps.versions.outputs.version != ''
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-android-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the preceding signed game and inspect its update dialog
        if: steps.versions.outputs.version != ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            bash scripts/test_published_ota_ui.sh "${{ steps.versions.outputs.version }}"
            bash scripts/test_signed_android_upgrade.sh "${{ steps.versions.outputs.version }}"
      - uses: actions/upload-artifact@v4
        if: always() && steps.versions.outputs.version != ''
        with:
          name: published-update-dialog
          path: |
            ${{ runner.temp }}/update-screen.png
            ${{ runner.temp }}/update-window.xml
            ${{ runner.temp }}/updated-game.png
            ${{ runner.temp }}/updated-game.xml
            ${{ runner.temp }}/installed-version.txt
          if-no-files-found: ignore
