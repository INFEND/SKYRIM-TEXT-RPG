name: Optimize location artwork
on:
  push:
    branches: [gallery-artwork-20261110]
    paths:
      - 'artwork_sources/**'
      - 'tools/optimize_location_gallery.py'
      - '.github/workflows/gallery-artwork.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gallery-artwork-20261110
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image encoders
        run: python -m pip install 'Pillow==11.3.0' 'numpy==2.2.6' 'scipy==1.15.3'
      - name: Encode new images and verify old archives
        run: python tools/optimize_location_gallery.py artwork_sources/index.json
      - name: Save optimized artwork to preparation branch
        env:
          ARTWORK_BRANCH: gallery-artwork-20261110
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/gallery/*.zip docs/gallery_expansion_compression.json
          if ! git diff --cached --quiet; then
            git commit -m "Save optimized location galleries and measured compression report"
            git push origin "HEAD:$ARTWORK_BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: location-gallery-compression-report
          path: docs/gallery_expansion_compression.json
