name: Verify Skyrim Wiki Russian item names
on:
  push:
    branches:
      - 'fix/wiki-ru-items-ingredients-*'
  pull_request:
    paths:
      - 'app/src/main/java/dev/infend/skyrimtext/ItemCatalog.java'
      - 'app/src/main/java/dev/infend/skyrimtext/RpgContent.java'
      - 'app/src/main/java/dev/infend/skyrimtext/AiStoryClient.java'
      - 'tests/test_wiki_ru_items.py'
permissions:
  contents: read
jobs:
  item-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Russian item naming and stable IDs
        run: python3 -m unittest discover -s tests -p 'test_wiki_ru_items.py' -v
      - name: Full Python regression suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -q
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        shell: bash
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile Android APK without publishing
        run: gradle --no-daemon :app:assembleDebug
