name: SKYRIM · Install verified Elisif artwork
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-elisif-gallery.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: skyrim-install-elisif
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconstruct, verify and publish the original archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin resource-transfer-elisif
          transfer=b01b9afe29b933976b4da601435c056b4e0f7215
          test "$(git rev-parse FETCH_HEAD)" = "$transfer"
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          for i in $(seq -w 0 19); do git show "$transfer:elisif-transfer/$i.b64"; done | base64 -d > "$tmp"
          echo "8e6c4f75b0cd8f93b650a4b62908851e0ca1c4ae254fd12d0b6d00b47a790e1a  $tmp" | sha256sum -c -
          git config user.name 'INFEND resource bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p app/src/main/assets/media/elisif
            cp "$tmp" app/src/main/assets/media/elisif/gallery.zip
            python3 -m unittest discover -s tests -p 'test_resource_elisif_gallery.py' -v
            git add app/src/main/assets/media/elisif/gallery.zip
            if git diff --cached --quiet; then break; fi
            git commit -m 'Publish all 10 original Elisif portraits as optional resource'
            if git push origin HEAD:main; then break; fi
            if [[ "$attempt" == 5 ]]; then exit 1; fi
          done
          gh workflow run resource-catalog.yml --ref main
          gh workflow run android-ota.yml --ref main
