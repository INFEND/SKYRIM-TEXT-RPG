name: Prepare verified map sources
on:
  push:
    branches: [map-source-import]
    paths: [.github/workflows/map-source-import.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read published Solstheim projection configuration
        shell: python
        run: |
          import pathlib,urllib.request
          with urllib.request.urlopen("https://tamrielma.ps/js/dragonborn-min.js",timeout=60) as r: body=r.read()
          pathlib.Path("docs/map-source/dragonborn-map.js").write_bytes(body)
          print("Projection script",len(body))
      - name: Save projection metadata
        run: |
          git config user.name INFEND
          git config user.email 342005527+INFEND@users.noreply.github.com
          git add docs/map-source/dragonborn-map.js
          git diff --cached --quiet || git commit -m "Read Solstheim terrain tile projection"
          git push origin HEAD:map-source-import
