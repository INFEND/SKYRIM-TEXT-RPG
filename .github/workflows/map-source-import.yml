name: Prepare verified map sources
on:
  push:
    branches: [map-source-import]
    paths: [.github/workflows/map-source-import.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read published UESP-derived offline atlas
        shell: python
        run: |
          import json,pathlib,urllib.request
          out=pathlib.Path("docs/map-source");out.mkdir(parents=True,exist_ok=True)
          def get(url):
              with urllib.request.urlopen(url,timeout=90) as r: return r.read()
          data=json.loads(get("https://itemaps.com/media/maps/skyrim/markers.json"))
          print("ROOT",type(data),list(data)[:30])
          metadata={}
          for key,val in data.items():
              print(key,type(val),len(val) if hasattr(val,"__len__") else val,str(val)[:1500])
              if isinstance(val,list) and len(val)>100:
                  for i in range(0,len(val),100):
                      (out/f"atlas-{key}-{i//100:03}.json").write_text(json.dumps(val[i:i+100],ensure_ascii=False))
              else: metadata[key]=val
          (out/"atlas-metadata.json").write_text(json.dumps(metadata,ensure_ascii=False,indent=2))
          (out/"client.js").write_bytes(get("https://itemaps.com/maps/client.js?v=20261024-icons"))
      - name: Save source snapshot on import branch
        run: |
          git config user.name INFEND
          git config user.email 342005527+INFEND@users.noreply.github.com
          git add docs/map-source
          git diff --cached --quiet || git commit -m "Record UESP-derived Skyrim and Solstheim geographic source"
          git push origin HEAD:map-source-import
