name: SKYRIM · Install verified Serana artwork
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-serana-gallery.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: skyrim-install-serana
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify and commit original gallery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin resource-transfer-serana
          transfer=01db296c845125597442302bba6d3c5c8de6b9fd
          test "$(git rev-parse FETCH_HEAD)" = "$transfer"
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          for i in $(seq -w 0 15); do git show "$transfer:serana-transfer/$i.b64"; done | base64 -d > "$tmp"
          echo "be77a3f3aa45a80767e43c5200a4440df97109a704b22cc16da7679abfc9bfaa  $tmp" | sha256sum -c -
          git config user.name 'INFEND resource bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p app/src/main/assets/media/serana
            cp "$tmp" app/src/main/assets/media/serana/gallery.zip
            python3 -m unittest discover -s tests -p 'test_resource_serana_gallery.py' -v
            git add app/src/main/assets/media/serana/gallery.zip
            if git diff --cached --quiet; then break; fi
            git commit -m 'Publish all 13 original Serana portraits as optional resource'
            if git push origin HEAD:main; then break; fi
            if [[ "$attempt" == 5 ]]; then exit 1; fi
          done
          gh workflow run resource-catalog.yml --ref main
          gh workflow run android-ota.yml --ref main
