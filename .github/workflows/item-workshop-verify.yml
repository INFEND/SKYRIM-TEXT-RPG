name: Item Workshop · Verify
on:
  push:
    branches:
      - feature/expanded-item-workshop-20261121
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Regression contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile Android sources
        run: gradle --no-daemon :app:compileDebugJavaWithJavac :app:testDebugUnitTest
