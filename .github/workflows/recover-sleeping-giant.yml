name: SKYRIM · Restore verified inn artwork
on:
  push:
    branches: [main]
    paths:
      - 'scripts/recover_sleeping_giant.py'
      - '.github/workflows/recover-sleeping-giant.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: skyrim-restore-inn
  cancel-in-progress: false
jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore verified WebP and register the inn
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'INFEND resource bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/recover_sleeping_giant.py
            python3 -m unittest discover -s tests -p 'test_resource*.py' -v
            python3 -m unittest discover -s tests -p 'test_recovered_inn.py' -v
            git add app/src/main/assets/gallery/sleeping_giant_inn.zip docs/gallery_registry.json docs/sleeping_giant_recovery.json
            if git diff --cached --quiet; then break; fi
            git commit -m 'Restore verified Sleeping Giant Inn interior as optional resource'
            if git push origin HEAD:main; then break; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
          done
          gh workflow run resource-catalog.yml --ref main
          gh workflow run android-ota.yml --ref main
