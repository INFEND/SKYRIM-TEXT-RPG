name: Android APK and OTA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skyrim-android-main
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify runner Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --version
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - name: Gate signed releases on all Python regression checks
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Generate signed optional-resource catalog (full build)
        run: python3 scripts/build_resource_catalog.py --commit "$GITHUB_SHA"
      - name: Bundle exact user-supplied Sovngarde fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/fonts
          MIRROR="https://raw.githubusercontent.com/B4lex/PlayerHub/e9fa97b3c312eb948f3808f5c2d1f053555d1a48/assets/fonts"
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error "$MIRROR/Sovngarde%20Light.ttf" -o "app/src/main/assets/fonts/Sovngarde Light.ttf"
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error "$MIRROR/Sovngarde%20Bold.ttf" -o "app/src/main/assets/fonts/Sovngarde Bold.ttf"
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error "$MIRROR/Sovngarde%20OFL%20License.txt" -o "app/src/main/assets/fonts/OFL.txt"
          printf '%s\n' \
            "8a080bba62534ca37bdd3137e933f9215dbf18e8a070495e4ae782ea7c3b9851  app/src/main/assets/fonts/Sovngarde Light.ttf" \
            "a4abb4f2cf49f7e52d87f45d59b1fe2592d464c94f049094f66520072317c2ef  app/src/main/assets/fonts/Sovngarde Bold.ttf" \
            "beb729413bd1bb04bfecbfd530eb0b899777fdd57472c8496a26e2cd53ef8bd5  app/src/main/assets/fonts/OFL.txt" \
            | sha256sum --check --strict
          echo "Exact font files verified against uploaded ZIP; fonts included in APK."
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify Sovngarde TTF and license inside debug APK
        shell: bash
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "assets/fonts/Sovngarde Light.ttf"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "assets/fonts/Sovngarde Bold.ttf"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "assets/fonts/OFL.txt"
      - name: Prepare debug artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SKYRIM-TEXT-RPG-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SKYRIM-TEXT-RPG-debug
          path: dist/SKYRIM-TEXT-RPG-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Detect release signing secret
        id: signing
        env:
          BUNDLE: ${{ secrets.SKYRIM_SIGNING_BUNDLE }}
        shell: bash
        run: |
          if [[ -n "$BUNDLE" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Signed OTA release skipped: add SKYRIM_SIGNING_BUNDLE in repository Actions secrets.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Read version and check release tag
        if: steps.signing.outputs.available == 'true'
        id: release_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n1)
          test -n "$VER"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          if gh release view "v${VER}" >/dev/null 2>&1; then
            echo "Version v${VER} already published. Bump app version before next OTA." >> "$GITHUB_STEP_SUMMARY"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Unpack private signing key
        if: steps.signing.outputs.available == 'true' && steps.release_version.outputs.publish == 'true'
        env:
          BUNDLE: ${{ secrets.SKYRIM_SIGNING_BUNDLE }}
        run: |
          printf '%s' "$BUNDLE" | base64 -d > /tmp/skyrim-signing.zip
          unzip -qo /tmp/skyrim-signing.zip -d .
          test -s release.jks
          test -s signing.properties
          chmod 600 release.jks signing.properties
      - name: Assemble signed release APK
        if: steps.signing.outputs.available == 'true' && steps.release_version.outputs.publish == 'true'
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify Sovngarde fonts inside signed APK
        if: steps.signing.outputs.available == 'true' && steps.release_version.outputs.publish == 'true'
        shell: bash
        run: |
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -F "assets/fonts/Sovngarde Light.ttf"
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -F "assets/fonts/Sovngarde Bold.ttf"
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -F "assets/fonts/OFL.txt"
      - name: Preserve full APK and build signed thin APK
        if: steps.signing.outputs.available == 'true' && steps.release_version.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk dist/SKYRIM-TEXT-RPG.apk
          python3 scripts/build_resource_catalog.py --commit "$GITHUB_SHA" --thin
          gradle --no-daemon --stacktrace :app:clean :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk dist/SKYRIM-TEXT-RPG-thin.apk
          python3 tools/verify_resource_apks.py
          for apk in dist/SKYRIM-TEXT-RPG.apk dist/SKYRIM-TEXT-RPG-thin.apk; do
            "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          done
          full=$("${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs dist/SKYRIM-TEXT-RPG.apk | grep 'Signer #1 certificate SHA-256 digest:')
          thin=$("${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs dist/SKYRIM-TEXT-RPG-thin.apk | grep 'Signer #1 certificate SHA-256 digest:')
          test "$full" = "$thin"
          [[ "${full,,}" == *"8a0d221b9c31007b55ac0baed5597a0b638881f7fef6650a6e7bd0e2b49793fe"* ]]
      - name: Create update manifest and release notes
        if: steps.signing.outputs.available == 'true' && steps.release_version.outputs.publish == 'true'
        run: |
          python3 tools/build_manifest.py
          python3 tools/check_ota_contract.py
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs dist/SKYRIM-TEXT-RPG.apk
      - name: Publish OTA release
        if: steps.signing.outputs.available == 'true' && steps.release_version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SKYRIM TEXT RPG ${{ steps.release_version.outputs.tag }}
          body_path: dist/release_notes.md
          files: |
            dist/SKYRIM-TEXT-RPG.apk
            dist/SKYRIM-TEXT-RPG-thin.apk
            dist/update.json
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
      - name: Publish trusted manifest mirror
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Always repair from the actual latest published release, even when
          # the APK was published by a previous attempt and no rebuild is needed.
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          mirror_dir=$(mktemp -d)
          trap 'rm -rf "$mirror_dir"' EXIT
          gh release download "$tag" --pattern update.json --dir "$mirror_dir"
          export MIRROR_TAG="$tag" MIRROR_DIR="$mirror_dir"
          python3 - <<'PY'
          import json, os, pathlib, re
          p=pathlib.Path(os.environ["MIRROR_DIR"])/"update.json"
          j=json.loads(p.read_bytes())
          assert "v"+j["versionName"]==os.environ["MIRROR_TAG"]
          assert j.get("apkPackageName",j.get("packageName"))=="dev.infend.skyrimtext"
          assert re.fullmatch("[0-9a-fA-F]{64}",j["sha256"])
          PY
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/ota-manifest" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/ota-manifest" -f sha="${GITHUB_SHA}" >/dev/null
          fi
          # Pass JSON from a file, not a single argv element: long cumulative
          # changelogs exceed Linux MAX_ARG_STRLEN after base64 encoding.
          for attempt in 1 2 3; do
            previous=$(gh api "repos/${GITHUB_REPOSITORY}/contents/update.json?ref=ota-manifest" --jq .sha 2>/dev/null || true)
            export PREVIOUS="$previous"
            python3 - <<'PY'
          import base64,json,os,pathlib
          root=pathlib.Path(os.environ["MIRROR_DIR"])
          raw=(root/"update.json").read_bytes()
          payload={"message":"Mirror signed SKYRIM "+os.environ["MIRROR_TAG"]+" OTA manifest","branch":"ota-manifest","content":base64.b64encode(raw).decode("ascii")}
          if os.environ["PREVIOUS"]:payload["sha"]=os.environ["PREVIOUS"]
          (root/"request.json").write_text(json.dumps(payload))
          PY
            if gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/update.json" --input "$mirror_dir/request.json" >/dev/null; then
              echo "Trusted raw OTA manifest mirror published after official release: $tag" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep "$attempt"
          done
      - name: Upload signed APK artifact
        if: steps.signing.outputs.available == 'true' && steps.release_version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SKYRIM-TEXT-RPG-signed
          path: |
            dist/SKYRIM-TEXT-RPG.apk
            dist/SKYRIM-TEXT-RPG-thin.apk
          if-no-files-found: error
          retention-days: 30
