name: Local GGUF streaming branch validation
on:
  push:
    branches:
      - feature/streaming-qwen-engine-20261110
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform 36
        shell: bash
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Python regression checks
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
