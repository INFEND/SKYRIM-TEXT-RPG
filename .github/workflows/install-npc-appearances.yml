name: SKYRIM · Install verified NPC appearances
on:
  push:
    branches: [main]
    paths: ['NPC_Appearances_SKYRIM.zip']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: skyrim-install-npc-appearances
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify and install the five original WebP files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'INFEND resource bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import hashlib, pathlib, zipfile
          from collections import Counter
          expected = {
              'astrid.webp': 'b4cabe15d2b6f84b03268d6c537e530f3cb9ccd5bb70a5120c1d97c9fb56ec64',
              'vex.webp': '0654bb14364788a84e9fa2a71e147c1d2bfd3889a00e75c3ef3e5fffdacc3a03',
              'karliah.webp': '7cddc76b26dbaf9a8f50849e58b39963469c848719b4dfc5e43880779cadebc7',
              'nocturnal.webp': '8ee39da941e16282717152409f4fc0b2e9fafd14407d94e791ce797644db5104',
              'elisif.webp': 'a65a8948644d84dd040814bbb6e26503b65761b3fb93bbf99b260c345da0bf80',
          }
          source = pathlib.Path('NPC_Appearances_SKYRIM.zip')
          destination = pathlib.Path('app/src/main/assets/media/npc')
          def verify(name, raw):
              if len(raw) > 2_000_000 or raw[:4] != b'RIFF' or raw[8:12] != b'WEBP' or hashlib.sha256(raw).hexdigest() != expected[name]:
                  raise ValueError('Unexpected original WebP: ' + name)
          if source.exists():
              with zipfile.ZipFile(source) as archive:
                  if Counter(archive.namelist()) != Counter(expected.keys()):
                      raise ValueError('Archive must contain exactly the five original WebP files')
                  if any(info.file_size > 2_000_000 for info in archive.infolist()):
                      raise ValueError('Oversized archive member')
                  raw_files = {name: archive.read(name) for name in expected}
              for name, raw in raw_files.items():
                  verify(name, raw)
              destination.mkdir(parents=True, exist_ok=True)
              for name, raw in raw_files.items():
                  (destination / name).write_bytes(raw)
              source.unlink()
          for name in expected:
              verify(name, (destination / name).read_bytes())
          print('All 5 originals verified:', sum((destination / n).stat().st_size for n in expected), 'bytes')
          PY
            python3 -m unittest discover -s tests -p 'test_npc_appearances.py' -v
            git add app/src/main/assets/media/npc
            git add -u -- NPC_Appearances_SKYRIM.zip 2>/dev/null || true
            if git diff --cached --quiet; then break; fi
            git commit -m 'Publish five original NPC appearances as optional resources'
            if git push origin HEAD:main; then break; fi
            if [[ "$attempt" == 5 ]]; then exit 1; fi
          done
          gh workflow run resource-catalog.yml --ref main
